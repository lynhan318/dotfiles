# Generated by Noctalia from ~/.dotfiles/noctalia/templates/herdr/herdr.toml
# Palette mode: {{mode}}
#
# herdr has no "everforest"-style custom theme file: the base theme in [theme]
# is one of its builtins, and [theme.custom] overrides individual tokens on top
# of it. Every token herdr exposes is overridden here, so the base theme only
# shows through for anything herdr adds in a future release.
[theme.custom]
# Backgrounds, dim -> elevated
panel_bg    = "{{colors.surface.default.hex}}"
surface_dim = "{{colors.surface_container_lowest.default.hex}}"
surface0    = "{{colors.surface_container_low.default.hex}}"
surface1    = "{{colors.surface_container.default.hex}}"
# Muted borders and comments
overlay0    = "{{colors.outline_variant.default.hex}}"
overlay1    = "{{colors.outline.default.hex}}"
# Foreground
text        = "{{colors.on_surface.default.hex}}"
subtext0    = "{{colors.on_surface_variant.default.hex}}"
# Accents. The ANSI-ish tokens come from the palette's terminal colors so they
# stay in step with kitty; accent/red/peach use the semantic roles instead.
accent      = "{{colors.primary.default.hex}}"
red         = "{{colors.error.default.hex}}"
green       = "{{colors.terminal_normal_green.default.hex}}"
yellow      = "{{colors.terminal_normal_yellow.default.hex}}"
blue        = "{{colors.terminal_normal_blue.default.hex}}"
teal        = "{{colors.terminal_normal_cyan.default.hex}}"
mauve       = "{{colors.terminal_normal_magenta.default.hex}}"
peach       = "{{colors.tertiary.default.hex}}"
