# herdr configuration — ported from ~/.tmux.conf
# Reload after editing with: herdr server reload-config  (or prefix+r below)

onboarding = false

[theme]
# Colors follow the Noctalia shell palette: the [theme.custom] block at the
# bottom of this file is generated by the "herdr" Noctalia template
# (~/.dotfiles/noctalia/templates/herdr) on every palette change. Edit the
# template, not the generated block. The base theme below only shows through
# for tokens the template does not override.
auto_switch = false

[terminal]
# tmux: set-option -g default-shell /usr/bin/zsh
default_shell = "/usr/bin/zsh"
# tmux split-window used -c '#{pane_current_path}' -> inherit source pane cwd
new_cwd = "follow"

[keys]
prefix = "ctrl+f"
switch_tab = "ctrl+1..9"
switch_workspace = "prefix+1..9"
focus_agent = "prefix+shift+1..9"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
workspace_picker = "prefix+p"
next_tab = ["prefix+n", "ctrl+shift+right"]
previous_tab = "ctrl+shift+left"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
settings = "prefix+shift+s" 
zoom = "prefix+z"
rename_tab = "prefix+comma"

[[keys.command]]
key = "prefix+ctrl+y"
type = "pane"
command = "lazygit"

# tmux: bind-key C-t display-popup  (scratch shell in current path)
[[keys.command]]
key = "prefix+ctrl+t"
type = "pane"
command = "/usr/bin/zsh"

[[keys.command]]              # open in a split beside your work
key = "prefix+f"
type = "pane"
command = "yazi"

[ui]
# tmux: set -g mouse on
mouse_capture = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
pane_gaps = false

[ui.toast]
delivery = "off"

[advanced]
# tmux: set -g history-limit 1000000 (lines). herdr counts bytes; ~100MB here.
scrollback_limit_bytes = 100000000

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[experimental]
pane_history = true

# >>> noctalia theme - generated, do not edit >>>
# Generated by Noctalia from ~/.dotfiles/noctalia/templates/herdr/herdr.toml
# Palette mode: dark
#
# herdr has no "everforest"-style custom theme file: the base theme in [theme]
# is one of its builtins, and [theme.custom] overrides individual tokens on top
# of it. Every token herdr exposes is overridden here, so the base theme only
# shows through for anything herdr adds in a future release.
[theme.custom]
# Backgrounds, dim -> elevated
panel_bg    = "#2d353b"
surface_dim = "#30383e"
surface0    = "#353e44"
surface1    = "#3d484d"
# Muted borders and comments
overlay0    = "#555c54"
overlay1    = "#7a8478"
# Foreground
text        = "#d3c6aa"
subtext0    = "#d3c6aa"
# Accents. The ANSI-ish tokens come from the palette's terminal colors so they
# stay in step with kitty; accent/red/peach use the semantic roles instead.
accent      = "#a7c080"
red         = "#e67e80"
green       = "#a7c080"
yellow      = "#dbbc7f"
blue        = "#7fbbb3"
teal        = "#83c092"
mauve       = "#d699b6"
peach       = "#e69875"
# <<< noctalia theme <<<
